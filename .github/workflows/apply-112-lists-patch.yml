name: Apply Documents 1.1.2 list patch

on:
  push:
    branches:
      - modernize-1.1.2
    paths:
      - tools/patch-include-lists-112.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernize-1.1.2

      - name: Apply guarded include_lists.php patch
        run: python3 tools/patch-include-lists-112.py

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- include_lists.php
          if git diff --cached --quiet; then
            echo "No include_lists.php changes to commit"
            exit 0
          fi
          git commit -m "Documents 1.1.2: stabilize list rendering"
          git push origin HEAD:modernize-1.1.2
