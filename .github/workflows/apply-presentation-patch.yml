name: Apply Documents presentation patch

on:
  push:
    branches:
      - modernize-1.1.9
    paths:
      - '.github/workflows/apply-presentation-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact source replacements
        run: php tools/apply-presentation-patch.php
      - name: Verify PHP syntax
        run: php -l include_edit.php && php -l include_html.php
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include_edit.php include_html.php
          git diff --cached --quiet && exit 0
          git commit -m 'Documents 1.1.9: add text display formatting'
          git push origin HEAD:${GITHUB_REF_NAME}
