name: Apply public page fixes

on:
  push:
    branches:
      - modernize-1.1.10
    paths:
      - .github/workflows/apply-public-page-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.1.10
          fetch-depth: 0

      - name: Apply fixes
        run: python3 tools/apply_public_page_fixes.py

      - name: Validate PHP syntax and regression test
        run: |
          php -l public_html/document.php
          php -l public_html/category-list.php
          php -l public_html/home.php
          php -l language/english.php
          php -l language/french_france_utf-8.php
          php tests/public_navigation_headings_test.php

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public_html/document.php public_html/category-list.php public_html/home.php language/english.php language/french_france_utf-8.php tests/public_navigation_headings_test.php
          git commit -m 'Fix public breadcrumbs and heading duplication [skip ci]'
          git push origin HEAD:modernize-1.1.10
