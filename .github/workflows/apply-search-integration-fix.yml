name: Apply Documents search integration fix

on:
  push:
    branches:
      - modernize-1.1.9
    paths:
      - '.github/workflows/apply-search-integration-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact replacements
        shell: python
        run: |
          from pathlib import Path
          p = Path('functions.inc')
          s = p.read_text()
          replacements = [
              ("$columns = array('d.doc_url', 'v.v_value');", "$columns = array('d.doc_url', 'v.v_value', $descriptionSql);"),
              ("rawurlencode($row['cat_url']) . '/' . rawurlencode($row['doc_url']);", "$row['cat_url'] . '/' . $row['doc_url'];"),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit('Expected exactly one match: ' + old)
              s = s.replace(old, new)
          p.write_text(s)
      - name: Verify PHP syntax
        run: php -l functions.inc
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.inc
          git diff --cached --quiet && exit 0
          git commit -m 'Documents 1.1.9: finalize search integration'
          git push origin HEAD:${GITHUB_REF_NAME}
