name: Build Documents 1.1.2 installable test package

on:
  workflow_dispatch:
  push:
    branches:
      - modernize-1.1.2
    paths:
      - '*.php'
      - '*.inc'
      - 'admin/**'
      - 'public_html/**'
      - 'sql/**'
      - 'language/**'
      - '.github/workflows/build-112-installable.yml'

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernize-1.1.2

      - name: Apply 1.1.2 runtime fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('include_html.php')
          text = path.read_text()
          old = "if ($missingfields != '') {"
          new = "if (!empty($missingfields)) {"
          count = text.count(old)
          if count not in (0, 2):
              raise SystemExit('Unexpected missing-field legacy check count: %d' % count)
          if count == 2:
              text = text.replace(old, new)
          if old in text:
              raise SystemExit('Legacy missing-field check remains in include_html.php')
          path.write_text(text)

          path = Path('include_lists.php')
          text = path.read_text()
          old_perm = "COM_getPermSQL( $type = 'AND', $_USER['uid'], 2, 'doc')"
          new_perm = "COM_getPermSQL('AND', $_USER['uid'], 2, 'doc')"
          if old_perm in text:
              text = text.replace(old_perm, new_perm, 1)
          if old_perm in text:
              raise SystemExit('Legacy COM_getPermSQL assignment remains')

          old_b_doc = "$_DOCUMENTS_CONF['site_url'] . '/' . $A['cat_url'] . '/' . $B['doc_url']"
          new_b_doc = "$_DOCUMENTS_CONF['site_url'] . '/index.php?mode=view&cat=' . rawurlencode($A['cat_url']) . '&doc=' . rawurlencode($B['doc_url'])"
          if old_b_doc in text:
              text = text.replace(old_b_doc, new_b_doc)

          old_a_doc = "$_DOCUMENTS_CONF['site_url'] . '/' . $A['cat_url'] . '/' . $A['doc_url']"
          new_a_doc = "$_DOCUMENTS_CONF['site_url'] . '/index.php?mode=view&cat=' . rawurlencode($A['cat_url']) . '&doc=' . rawurlencode($A['doc_url'])"
          if old_a_doc in text:
              text = text.replace(old_a_doc, new_a_doc)

          old_cat = "$_DOCUMENTS_CONF['site_url'] . '/' . $A['cat_url']"
          new_cat = "$_DOCUMENTS_CONF['site_url'] . '/index.php?mode=view&cat=' . rawurlencode($A['cat_url'])"
          if old_cat in text:
              text = text.replace(old_cat, new_cat)
          if "$_DOCUMENTS_CONF['site_url'] . '/' . $A['cat_url']" in text:
              raise SystemExit('Pretty category URL dependency remains in include_lists.php')
          path.write_text(text)

          language_updates = {
              'language/english.php': "\t'existing_field' => 'Existing fields (order and name)',\n",
              'language/french_france_utf-8.php': "\t'existing_field' => 'Champs existants (ordre et nom)',\n",
          }
          for filename, addition in language_updates.items():
              path = Path(filename)
              text = path.read_text()
              if "'existing_field'" not in text:
                  marker = "\t'field_order'     => 'Field order',\n"
                  if marker not in text:
                      raise SystemExit('%s field_order marker not found' % filename)
                  text = text.replace(marker, marker + addition, 1)
              path.write_text(text)

          path = Path('include_edit.php')
          text = path.read_text()
          stale = "    $template->set_var('required_doc', $LANG_DOCUMENTS_1['required_doc']);\n"
          if stale in text:
              text = text.replace(stale, '', 1)
          if "['required_doc']" in text:
              raise SystemExit('Stale required_doc language access remains in include_edit.php')

          old_access = "        $accessPerms = $template->parse('access_perms', 'access');"
          new_access = "        $template->parse('access_perms', 'access');\n        $accessPerms = $template->finish($template->get_var('access_perms'));"
          if old_access in text:
              text = text.replace(old_access, new_access, 1)

          old_return = "    return $template->parse('output', 'doc');"
          new_return = "    $template->parse('output', 'doc');\n    $retval = $template->finish($template->get_var('output'));\n\n    return $retval;"
          if old_return in text:
              text = text.replace(old_return, new_return, 1)

          old_files = "    $template->set_file(array(\n        'doc' => 'doc_form.thtml',\n        'access' => 'access_permissions.thtml'\n    ));"
          new_files = "    $template->set_file(array('doc' => 'doc_form.thtml'));"
          if old_files in text:
              text = text.replace(old_files, new_files, 1)

          old_access_block = "        $template->set_var('lang_accessrights', $LANG_ACCESS['accessrights']);\n        $template->set_var('lang_owner', $LANG_ACCESS['owner']);\n        $template->set_var('owner_select', $ownerSelect);\n        $template->set_var('owner', COM_getDisplayName((int) $doc['owner_id']));\n        $template->set_var('lang_group', $LANG_ACCESS['group']);\n        $template->set_var('group_dropdown', SEC_getGroupDropdown((int) $doc['group_id'], 3));\n        $template->set_var(\n            'permissions_editor',\n            SEC_getPermissionsHTML(\n                $doc['perm_owner'],\n                $doc['perm_group'],\n                $doc['perm_members'],\n                $doc['perm_anon']\n            )\n        );\n        $template->set_var('lang_permissions', $LANG_ACCESS['permissions']);\n        $template->set_var('lang_perm_key', $LANG_ACCESS['permissionskey']);\n        $template->set_var('permissions_msg', $LANG_ACCESS['permmsg']);\n        $template->set_var('lang_permissions_msg', $LANG_ACCESS['permmsg']);\n        $template->parse('access_perms', 'access');\n        $accessPerms = $template->finish($template->get_var('access_perms'));"
          new_access_block = "        $accessTemplate = COM_newTemplate($_CONF['path'] . 'plugins/documents/templates');\n        $accessTemplate->set_file(array('access' => 'access_permissions.thtml'));\n        $accessTemplate->set_var('lang_accessrights', $LANG_ACCESS['accessrights']);\n        $accessTemplate->set_var('lang_owner', $LANG_ACCESS['owner']);\n        $accessTemplate->set_var('owner_select', $ownerSelect);\n        $accessTemplate->set_var('owner', COM_getDisplayName((int) $doc['owner_id']));\n        $accessTemplate->set_var('lang_group', $LANG_ACCESS['group']);\n        $accessTemplate->set_var('group_dropdown', SEC_getGroupDropdown((int) $doc['group_id'], 3));\n        $accessTemplate->set_var(\n            'permissions_editor',\n            SEC_getPermissionsHTML(\n                $doc['perm_owner'],\n                $doc['perm_group'],\n                $doc['perm_members'],\n                $doc['perm_anon']\n            )\n        );\n        $accessTemplate->set_var('lang_permissions', $LANG_ACCESS['permissions']);\n        $accessTemplate->set_var('lang_perm_key', $LANG_ACCESS['permissionskey']);\n        $accessTemplate->set_var('permissions_msg', $LANG_ACCESS['permmsg']);\n        $accessTemplate->set_var('lang_permissions_msg', $LANG_ACCESS['permmsg']);\n        $accessTemplate->parse('access_perms', 'access');\n        $accessPerms = $accessTemplate->finish($accessTemplate->get_var('access_perms'));"
          if old_access_block in text:
              text = text.replace(old_access_block, new_access_block, 1)

          old_final = "    $template->parse('output', 'doc');\n    $retval = $template->finish($template->get_var('output'));\n\n    return $retval;"
          new_final = "    $template->parse('output', 'doc');\n    $retval = $template->finish($template->get_var('output'));\n    if (trim((string) $retval) === '') {\n        COM_errorLog('Documents: doc_form.thtml rendered an empty result for category ' . (int) $doc['cid']);\n        return '<div class=\"pluginAlert\">Documents: the document form template returned no output.</div>';\n    }\n\n    return $retval;"
          if old_final in text:
              text = text.replace(old_final, new_final, 1)

          if "'access' => 'access_permissions.thtml'" in text[text.find('function DOCUMENTS_editDoc'):text.find('function DOCUMENTS_buildRawForm')]:
              raise SystemExit('Document form still shares the access template object')
          if "$accessTemplate->set_file(array('access' => 'access_permissions.thtml'));" not in text:
              raise SystemExit('Dedicated access template renderer is missing')
          if "document form template returned no output" not in text:
              raise SystemExit('Empty document template guard is missing')
          path.write_text(text)
          PY

      - name: Validate HTML document API
        shell: bash
        run: |
          if grep -qE 'COM_siteHeader|COM_siteFooter' include_html.php; then
            echo 'Legacy page wrapper remains in include_html.php'
            exit 1
          fi

      - name: Prepare report
        shell: bash
        run: |
          rm -rf test-artifacts build
          mkdir -p test-artifacts
          printf 'Documents 1.1.2 test package\nCommit: %s\n\n' "$GITHUB_SHA" > test-artifacts/lint-report.txt

      - name: Setup PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none

      - name: Lint PHP 5.6
        shell: bash
        run: |
          printf '=== PHP 5.6 ===\n' >> test-artifacts/lint-report.txt
          php -v | head -1 >> test-artifacts/lint-report.txt
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >> test-artifacts/lint-report.txt 2>&1; then failed=1; fi
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './build/*' -not -path './test-artifacts/*' -print0)
          printf '\n' >> test-artifacts/lint-report.txt
          if [ "$failed" -ne 0 ]; then exit 1; fi

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Lint PHP 7.4
        shell: bash
        run: |
          printf '=== PHP 7.4 ===\n' >> test-artifacts/lint-report.txt
          php -v | head -1 >> test-artifacts/lint-report.txt
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >> test-artifacts/lint-report.txt 2>&1; then failed=1; fi
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './build/*' -not -path './test-artifacts/*' -print0)
          printf '\n' >> test-artifacts/lint-report.txt
          if [ "$failed" -ne 0 ]; then exit 1; fi

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP 8.1
        shell: bash
        run: |
          printf '=== PHP 8.1 ===\n' >> test-artifacts/lint-report.txt
          php -v | head -1 >> test-artifacts/lint-report.txt
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >> test-artifacts/lint-report.txt 2>&1; then failed=1; fi
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './build/*' -not -path './test-artifacts/*' -print0)
          printf '\n' >> test-artifacts/lint-report.txt
          if [ "$failed" -ne 0 ]; then exit 1; fi

      - name: Build installable ZIP
        shell: bash
        run: |
          mkdir -p build/documents
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='tools' \
            --exclude='test-artifacts' \
            --exclude='.gitkeep' \
            ./ build/documents/

          if find build/documents -mindepth 1 -printf '%P\n' | awk -F/ '{for(i=1;i<=NF;i++) if ($i ~ /^\./) exit 1}'; then
            printf 'Archive filename safety check: PASS - no dotfiles.\n' >> test-artifacts/lint-report.txt
          else
            echo 'Unsafe archive filename detected.'
            exit 1
          fi

          if [ -f build/documents/public_html/.htaccess ] || [ -f build/documents/public_html/htaccess.txt ]; then
            echo 'Rewrite helper file must not be present in upload archive.'
            exit 1
          fi

          if ! grep -q 'file_put_contents($target, $rules)' build/documents/autoinstall.php; then
            echo 'Direct postinstall htaccess generation missing.'
            exit 1
          fi

          cd build
          zip -r ../test-artifacts/documents-1.1.2-test.zip documents >/dev/null
          cd ..

          printf 'Rewrite helper check: PASS - no htaccess file/template in archive.\n' >> test-artifacts/lint-report.txt
          printf 'Postinstall check: PASS - autoinstall writes .htaccess directly.\n' >> test-artifacts/lint-report.txt
          printf 'HTML document API check: PASS - no COM_siteHeader/COM_siteFooter in include_html.php.\n' >> test-artifacts/lint-report.txt
          printf 'Missing-field validation check: PASS - empty arrays do not trigger errors.\n' >> test-artifacts/lint-report.txt
          printf 'Routing check: PASS - generated list links work without mod_rewrite.\n' >> test-artifacts/lint-report.txt
          printf 'Field language check: PASS - existing_field is defined in EN/FR.\n' >> test-artifacts/lint-report.txt
          printf 'Document form check: PASS - stale required_doc access removed.\n' >> test-artifacts/lint-report.txt
          printf 'Template rendering check: PASS - document and access templates use isolated renderers.\n' >> test-artifacts/lint-report.txt
          printf 'Empty template guard: PASS - empty document form output is visible and logged.\n' >> test-artifacts/lint-report.txt
          printf 'RESULT: PASS - documents-1.1.2-test.zip created.\n' >> test-artifacts/lint-report.txt

      - name: Commit source corrections, diagnostic and package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- include_html.php include_lists.php include_edit.php language/english.php language/french_france_utf-8.php test-artifacts/lint-report.txt test-artifacts/documents-1.1.2-test.zip
          if git diff --cached --quiet; then
            echo 'Package is already current.'
          else
            git commit -m 'Documents 1.1.2: isolate document form template rendering'
            git push origin HEAD:modernize-1.1.2
          fi
