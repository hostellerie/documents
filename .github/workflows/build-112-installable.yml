name: Build Documents 1.1.2 installable test package

on:
  push:
    branches:
      - modernize-1.1.2
    paths:
      - '*.php'
      - '*.inc'
      - 'admin/**'
      - 'public_html/**'
      - 'sql/**'
      - 'language/**'
      - '.github/workflows/build-112-installable.yml'

permissions:
  contents: write

jobs:
  validate-and-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernize-1.1.2

      - name: Migrate public page wrappers
        shell: python
        run: |
          from pathlib import Path

          path = Path('include_html.php')
          text = path.read_text()

          replacements = [
              (
                  """    if (!$upload->setPath($_DOCUMENTS_CONF['path_images'])) {
        $output = COM_siteHeader('menu', $LANG24[30]);
        $output .= COM_startBlock($LANG24[30], '', COM_getBlockTemplate('_msg_block', 'header'));
        $output .= $upload->printErrors(false);
        $output .= COM_endBlock(COM_getBlockTemplate('_msg_block', 'footer'));
        $output .= COM_siteFooter();
        COM_output($output);
        exit;
    }
""",
                  """    if (!$upload->setPath($_DOCUMENTS_CONF['path_images'])) {
        $output = COM_startBlock($LANG24[30], '', COM_getBlockTemplate('_msg_block', 'header'));
        $output .= $upload->printErrors(false);
        $output .= COM_endBlock(COM_getBlockTemplate('_msg_block', 'footer'));
        $output = COM_createHTMLDocument($output, array('pagetitle' => $LANG24[30]));
        COM_output($output);
        exit;
    }
"""
              ),
              (
                  """    if ($upload->areErrors()) {
        $retval = COM_siteHeader('menu', $LANG24[30]);
        $retval .= COM_startBlock($LANG24[30], '', COM_getBlockTemplate('_msg_block', 'header'));
        $retval .= $upload->printErrors(false);
        $retval .= COM_endBlock(COM_getBlockTemplate('_msg_block', 'footer'));
        $retval .= COM_siteFooter();
        COM_output($retval);
        exit;
    }
""",
                  """    if ($upload->areErrors()) {
        $retval = COM_startBlock($LANG24[30], '', COM_getBlockTemplate('_msg_block', 'header'));
        $retval .= $upload->printErrors(false);
        $retval .= COM_endBlock(COM_getBlockTemplate('_msg_block', 'footer'));
        $retval = COM_createHTMLDocument($retval, array('pagetitle' => $LANG24[30]));
        COM_output($retval);
        exit;
    }
"""
              ),
              (
                  """$display .= COM_siteHeader('menu',  $page_title);
$display .= DOCUMENTS_user_menu();

// If any message
$display .= DOCUMENTS_message(DOCUMENTS_requestValue($_REQUEST, 'msg'));

$display .= $content;
$display .= COM_siteFooter();

COM_output($display);
""",
                  """$display .= DOCUMENTS_user_menu();

// If any message
$display .= DOCUMENTS_message(DOCUMENTS_requestValue($_REQUEST, 'msg'));

$display .= $content;
$display = COM_createHTMLDocument(
    $display,
    array('pagetitle' => $page_title)
);

COM_output($display);
"""
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True

          if 'COM_siteHeader' in text or 'COM_siteFooter' in text:
              raise SystemExit('legacy page wrapper remains in include_html.php')

          if changed:
              path.write_text(text)

      - name: Prepare report
        run: |
          rm -rf test-artifacts
          mkdir -p test-artifacts
          printf 'Documents 1.1.2 test package\nCommit: %s\n\n' "$GITHUB_SHA" > test-artifacts/lint-report.txt

      - name: Setup PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none

      - name: Lint PHP 5.6
        shell: bash
        run: |
          printf '=== PHP 5.6 ===\n' >> test-artifacts/lint-report.txt
          php -v | head -1 >> test-artifacts/lint-report.txt
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >> test-artifacts/lint-report.txt 2>&1; then failed=1; fi
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './build/*' -not -path './test-artifacts/*' -print0)
          if [ "$failed" -ne 0 ]; then touch /tmp/documents-lint-failed; fi
          printf '\n' >> test-artifacts/lint-report.txt

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Lint PHP 7.4
        shell: bash
        run: |
          printf '=== PHP 7.4 ===\n' >> test-artifacts/lint-report.txt
          php -v | head -1 >> test-artifacts/lint-report.txt
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >> test-artifacts/lint-report.txt 2>&1; then failed=1; fi
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './build/*' -not -path './test-artifacts/*' -print0)
          if [ "$failed" -ne 0 ]; then touch /tmp/documents-lint-failed; fi
          printf '\n' >> test-artifacts/lint-report.txt

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP 8.1
        shell: bash
        run: |
          printf '=== PHP 8.1 ===\n' >> test-artifacts/lint-report.txt
          php -v | head -1 >> test-artifacts/lint-report.txt
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >> test-artifacts/lint-report.txt 2>&1; then failed=1; fi
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './build/*' -not -path './test-artifacts/*' -print0)
          if [ "$failed" -ne 0 ]; then touch /tmp/documents-lint-failed; fi
          printf '\n' >> test-artifacts/lint-report.txt

      - name: Build installable ZIP when lint passes
        shell: bash
        run: |
          if [ -f /tmp/documents-lint-failed ]; then
            printf 'RESULT: FAILED - ZIP not created.\n' >> test-artifacts/lint-report.txt
            exit 0
          fi

          rm -rf build
          mkdir -p build/documents
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='tools' \
            --exclude='test-artifacts' \
            --exclude='.gitkeep' \
            ./ build/documents/

          unsafe=0
          while IFS= read -r -d '' path; do
            rel="${path#build/documents/}"
            IFS='/' read -r -a parts <<< "$rel"
            for part in "${parts[@]}"; do
              if [[ "$part" == .* ]]; then
                printf 'Unsafe archive path component: %s\n' "$rel" >> test-artifacts/lint-report.txt
                unsafe=1
                break
              fi
            done
          done < <(find build/documents -mindepth 1 -print0)

          if [ "$unsafe" -ne 0 ]; then
            printf 'RESULT: FAILED - unsafe archive filename detected.\n' >> test-artifacts/lint-report.txt
            touch /tmp/documents-lint-failed
            exit 0
          fi

          if [ -f build/documents/public_html/.htaccess ] || [ -f build/documents/public_html/htaccess.txt ]; then
            printf 'RESULT: FAILED - rewrite helper file must not be present in upload archive.\n' >> test-artifacts/lint-report.txt
            touch /tmp/documents-lint-failed
            exit 0
          fi

          if ! grep -q "file_put_contents(\$target, \$rules)" build/documents/autoinstall.php; then
            printf 'RESULT: FAILED - direct postinstall htaccess generation missing.\n' >> test-artifacts/lint-report.txt
            touch /tmp/documents-lint-failed
            exit 0
          fi

          cd build
          zip -r ../test-artifacts/documents-1.1.2-test.zip documents >/dev/null
          cd ..
          printf 'Archive filename safety check: PASS - no dotfiles.\n' >> test-artifacts/lint-report.txt
          printf 'Rewrite helper check: PASS - no htaccess file/template in archive.\n' >> test-artifacts/lint-report.txt
          printf 'Postinstall check: PASS - autoinstall writes .htaccess directly.\n' >> test-artifacts/lint-report.txt
          printf 'HTML document API check: PASS - no COM_siteHeader/COM_siteFooter in include_html.php.\n' >> test-artifacts/lint-report.txt
          printf 'RESULT: PASS - documents-1.1.2-test.zip created.\n' >> test-artifacts/lint-report.txt

      - name: Commit source correction, diagnostic and package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- include_html.php; then
            true
          else
            git add -- include_html.php
          fi
          git add -- test-artifacts/lint-report.txt
          if [ -f test-artifacts/documents-1.1.2-test.zip ]; then
            git add -- test-artifacts/documents-1.1.2-test.zip
          fi
          git commit -m "Documents 1.1.2: publish HTML API test package"
          git push origin HEAD:modernize-1.1.2

      - name: Fail workflow if validation failed
        shell: bash
        run: |
          if [ -f /tmp/documents-lint-failed ]; then exit 1; fi
