name: Documents CI

on:
  push:
    branches:
      - modernize-1.1.9
    paths:
      - '*.php'
      - '*.inc'
      - 'admin/**'
      - 'language/**'
      - 'public_html/**'
      - 'sql/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '*.php'
      - '*.inc'
      - 'admin/**'
      - 'language/**'
      - 'public_html/**'
      - 'sql/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '8.1']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint
        shell: bash
        run: |
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './test-artifacts/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Core tests
        shell: bash
        run: |
          php tests/storage_migration_test.php
          php tests/config_upgrade_test.php
          php tests/language_sync_test.php
          php tests/document_visibility_test.php
          php tests/document_edit_security_test.php
          php tests/release_candidate_test.php
          php tests/metadata_consistency_test.php
