name: Documents compatibility

on:
  push:
    branches:
      - modernize-1.1.10
  pull_request:

permissions:
  contents: read

jobs:
  php-compatibility:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '5.6'
          - '8.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP version
        run: php -v

      - name: Syntax lint
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -print0)

      - name: Static regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*_test.php; do
            echo "==> $test"
            php "$test"
          done
