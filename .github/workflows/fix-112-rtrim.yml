name: Fix Documents 1.1.2 rtrim syntax

on:
  push:
    branches:
      - modernize-1.1.2
    paths:
      - .github/workflows/fix-112-rtrim.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernize-1.1.2

      - name: Fix malformed rtrim mask
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include_html.php')
          s = p.read_text(encoding='utf-8')
          bad = "rtrim($templateDir, '/" + chr(92) + "'));"
          good = "rtrim($templateDir, '/" + chr(92) + chr(92) + "'));"
          if s.count(bad) != 1:
              raise SystemExit('Expected exactly one malformed rtrim mask')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')
          PY

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- include_html.php
          git commit -m "Documents 1.1.2: fix custom template rtrim syntax"
          git push origin HEAD:modernize-1.1.2
