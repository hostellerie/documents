name: Fix canonical redirects and clean debug

on:
  push:
    branches:
      - modernize-1.1.2
    paths:
      - '.github/workflows/fix-canonical-and-clean-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.1.2

      - name: Apply canonical redirect fix and remove diagnostics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # 1) .htaccess generator: keep only internal pretty-URL rewrites.
          p = Path('rewrite.php')
          s = p.read_text()
          start = s.index('        $rules = "RewriteEngine On\\n\\n"')
          end = s.index('        if (@file_put_contents', start)
          new_rules = '''        $rules = "RewriteEngine On\\n\\n"
            . "RewriteCond %{REQUEST_FILENAME} !-f\\n"
            . "RewriteCond %{REQUEST_FILENAME} !-d\\n"
            . "RewriteRule ^([^/]+)/([^/]+)/?$ index.php?mode=view&cat=$1&doc=$2 [L,QSA]\\n\\n"
            . "RewriteCond %{REQUEST_FILENAME} !-f\\n"
            . "RewriteCond %{REQUEST_FILENAME} !-d\\n"
            . "RewriteRule ^([^/]+)/?$ index.php?mode=view&cat=$1 [L,QSA]\\n";

'''
          s = s[:start] + new_rules + s[end:]
          p.write_text(s)

          # 2) Canonical 301 in PHP for explicit index.php URLs only.
          p = Path('public_html/index.php')
          s = p.read_text()
          anchor = "require_once $_CONF['path'] . 'plugins/documents/include_compat.php';\nDOCUMENTS_initializeRequestDefaults($_REQUEST);\n\n"
          redirect = r'''require_once $_CONF['path'] . 'plugins/documents/include_compat.php';
DOCUMENTS_initializeRequestDefaults($_REQUEST);

$requestPath = isset($_SERVER['REQUEST_URI'])
    ? parse_url((string) $_SERVER['REQUEST_URI'], PHP_URL_PATH)
    : '';
if (is_string($requestPath) && preg_match('#/index\.php$#', $requestPath)) {
    $mode = (string) DOCUMENTS_requestValue($_REQUEST, 'mode', '');
    $catUrl = (string) DOCUMENTS_requestValue($_REQUEST, 'cat', '');
    $docUrl = (string) DOCUMENTS_requestValue($_REQUEST, 'doc', '');

    if ($mode === 'view' && $catUrl !== '') {
        $canonical = rtrim((string) $_DOCUMENTS_CONF['site_url'], '/')
            . '/' . rawurlencode($catUrl);
        if ($docUrl !== '') {
            $canonical .= '/' . rawurlencode($docUrl);
        }
        header('Location: ' . $canonical, true, 301);
        exit;
    }
}

'''
          if anchor not in s:
              raise SystemExit('public index anchor not found')
          s = s.replace(anchor, redirect, 1)
          p.write_text(s)

          # 3) Remove all temporary Documents debug instrumentation.
          p = Path('include_html.php')
          s = p.read_text()
          lines = s.splitlines(True)
          kept = []
          skip_sentinel = False
          brace_depth = 0
          for line in lines:
              if skip_sentinel:
                  brace_depth += line.count('{') - line.count('}')
                  if brace_depth <= 0:
                      skip_sentinel = False
                  continue
              if 'DOCUMENTS DEBUG' in line:
                  continue
              if "$documentsDebug = isset($_GET['documents_debug'])" in line:
                  continue
              if 'DOCUMENTS OUTPUT SENTINEL' in line:
                  # drop containing if block: remove previously emitted opening line if present
                  while kept and kept[-1].strip() == '':
                      kept.pop()
                  if kept and 'if (isset($documentsDebug)' in kept[-1]:
                      kept.pop()
                  skip_sentinel = True
                  brace_depth = 1
                  continue
              kept.append(line)
          s = ''.join(kept)
          # Defensive cleanup of any remaining empty debug-only if blocks.
          s = re.sub(r"\nif \(isset\(\$documentsDebug\).*?\{\s*\}\n", "\n", s, flags=re.S)
          if 'DOCUMENTS DEBUG' in s or 'documents_debug' in s or 'DOCUMENTS OUTPUT SENTINEL' in s:
              raise SystemExit('temporary Documents diagnostics remain')
          p.write_text(s)
          PY

      - name: PHP lint
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validate
        shell: bash
        run: |
          php -l rewrite.php
          php -l public_html/index.php
          php -l include_html.php
          ! grep -q 'DOCUMENTS DEBUG' include_html.php
          ! grep -q 'documents_debug' include_html.php
          ! grep -q 'THE_REQUEST' rewrite.php
          grep -q "header('Location: ' . \$canonical, true, 301)" public_html/index.php

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rewrite.php public_html/index.php include_html.php
          git commit -m 'Documents 1.1.2: fix canonical redirects and remove debug logs'
          git push origin HEAD:modernize-1.1.2
