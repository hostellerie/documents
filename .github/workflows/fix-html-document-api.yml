name: Fix Documents HTML document API

on:
  push:
    branches:
      - modernize-1.1.2
    paths:
      - .github/workflows/fix-html-document-api.yml

permissions:
  contents: write

jobs:
  fix-html-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.1.2

      - name: Replace legacy page wrappers
        shell: python
        run: |
          from pathlib import Path

          path = Path('include_html.php')
          text = path.read_text()

          old = """    if (!$upload->setPath($_DOCUMENTS_CONF['path_images'])) {
        $output = COM_siteHeader('menu', $LANG24[30]);
        $output .= COM_startBlock($LANG24[30], '', COM_getBlockTemplate('_msg_block', 'header'));
        $output .= $upload->printErrors(false);
        $output .= COM_endBlock(COM_getBlockTemplate('_msg_block', 'footer'));
        $output .= COM_siteFooter();
        COM_output($output);
        exit;
    }
"""
          new = """    if (!$upload->setPath($_DOCUMENTS_CONF['path_images'])) {
        $output = COM_startBlock($LANG24[30], '', COM_getBlockTemplate('_msg_block', 'header'));
        $output .= $upload->printErrors(false);
        $output .= COM_endBlock(COM_getBlockTemplate('_msg_block', 'footer'));
        $output = COM_createHTMLDocument($output, array('pagetitle' => $LANG24[30]));
        COM_output($output);
        exit;
    }
"""
          if old not in text:
              raise SystemExit('upload path error wrapper not found')
          text = text.replace(old, new, 1)

          old = """    if ($upload->areErrors()) {
        $retval = COM_siteHeader('menu', $LANG24[30]);
        $retval .= COM_startBlock($LANG24[30], '', COM_getBlockTemplate('_msg_block', 'header'));
        $retval .= $upload->printErrors(false);
        $retval .= COM_endBlock(COM_getBlockTemplate('_msg_block', 'footer'));
        $retval .= COM_siteFooter();
        COM_output($retval);
        exit;
    }
"""
          new = """    if ($upload->areErrors()) {
        $retval = COM_startBlock($LANG24[30], '', COM_getBlockTemplate('_msg_block', 'header'));
        $retval .= $upload->printErrors(false);
        $retval .= COM_endBlock(COM_getBlockTemplate('_msg_block', 'footer'));
        $retval = COM_createHTMLDocument($retval, array('pagetitle' => $LANG24[30]));
        COM_output($retval);
        exit;
    }
"""
          if old not in text:
              raise SystemExit('upload error wrapper not found')
          text = text.replace(old, new, 1)

          old = """$display .= COM_siteHeader('menu',  $page_title);
$display .= DOCUMENTS_user_menu();

// If any message
$display .= DOCUMENTS_message(DOCUMENTS_requestValue($_REQUEST, 'msg'));

$display .= $content;
$display .= COM_siteFooter();

COM_output($display);
"""
          new = """$display .= DOCUMENTS_user_menu();

// If any message
$display .= DOCUMENTS_message(DOCUMENTS_requestValue($_REQUEST, 'msg'));

$display .= $content;
$display = COM_createHTMLDocument(
    $display,
    array('pagetitle' => $page_title)
);

COM_output($display);
"""
          if old not in text:
              raise SystemExit('public page wrapper not found')
          text = text.replace(old, new, 1)

          if 'COM_siteHeader' in text or 'COM_siteFooter' in text:
              raise SystemExit('legacy page wrapper remains in include_html.php')

          path.write_text(text)

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- include_html.php
          git commit -m "Documents 1.1.2: use HTML document API on public pages"
          git push origin HEAD:modernize-1.1.2
