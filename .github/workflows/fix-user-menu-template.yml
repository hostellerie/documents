name: Fix Documents user menu template API

on:
  push:
    branches:
      - modernize-1.1.2
    paths:
      - '.github/workflows/fix-user-menu-template.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.1.2

      - name: Replace legacy Template constructor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('include_html.php')
          s = p.read_text()
          old = "$menu = new Template($_CONF['path'] . 'plugins/documents/templates/menus');"
          new = "$menu = COM_newTemplate($_CONF['path'] . 'plugins/documents/templates/menus');"
          if old not in s:
              raise SystemExit('legacy user menu Template constructor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Lint
        run: php -l include_html.php

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include_html.php
          git commit -m 'Documents 1.1.2: use COM_newTemplate for user menu'
          git push origin HEAD:modernize-1.1.2
