name: Instrument Documents new route

on:
  push:
    branches:
      - modernize-1.1.2
    paths:
      - '.github/workflows/instrument-new-route.yml'

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.1.2

      - name: Add temporary route diagnostics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('include_html.php')
          s = p.read_text()

          old = "\tcase 'new' :\n\t    \n\t\trequire_once ($_CONF['path']  . 'plugins/documents/include_edit.php');"
          new = "\tcase 'new' :\n\t    \n\t\t$documentsDebug = isset($_GET['documents_debug']) && $_GET['documents_debug'] == '1';\n\t\tif ($documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N01 enter case new</pre>'; @ob_flush(); @flush(); }\n\t\tCOM_errorLog('DOCUMENTS DEBUG N01 enter case new');\n\n\t\trequire_once ($_CONF['path']  . 'plugins/documents/include_edit.php');\n\t\tif ($documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N02 include_edit loaded</pre>'; @ob_flush(); @flush(); }\n\t\tCOM_errorLog('DOCUMENTS DEBUG N02 include_edit loaded');"
          if old not in s:
              raise SystemExit('new route anchor not found')
          s = s.replace(old, new, 1)

          old = "\t\t\t$newCatUrl = addslashes((string) DOCUMENTS_requestValue($_REQUEST, 'cat', ''));"
          new = "\t\t\tif ($documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N03 authenticated user</pre>'; @ob_flush(); @flush(); }\n\t\t\tCOM_errorLog('DOCUMENTS DEBUG N03 authenticated user');\n\t\t\t$newCatUrl = addslashes((string) DOCUMENTS_requestValue($_REQUEST, 'cat', ''));\n\t\t\tif ($documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N04 cat=' . htmlspecialchars($newCatUrl, ENT_QUOTES, 'UTF-8') . '</pre>'; @ob_flush(); @flush(); }\n\t\t\tCOM_errorLog('DOCUMENTS DEBUG N04 cat=' . $newCatUrl);"
          if old not in s:
              raise SystemExit('category anchor not found')
          s = s.replace(old, new, 1)

          old = "\t\t\t$res = DB_query($sql);\n\t\t\t$cat = DB_fetchArray($res);"
          new = "\t\t\tif ($documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N05 before category query</pre>'; @ob_flush(); @flush(); }\n\t\t\tCOM_errorLog('DOCUMENTS DEBUG N05 before category query');\n\t\t\t$res = DB_query($sql);\n\t\t\tif ($documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N06 after category query</pre>'; @ob_flush(); @flush(); }\n\t\t\tCOM_errorLog('DOCUMENTS DEBUG N06 after category query');\n\t\t\t$cat = DB_fetchArray($res);\n\t\t\tif ($documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N07 category fetched cid=' . (isset($cat['cid']) ? (int) $cat['cid'] : 0) . '</pre>'; @ob_flush(); @flush(); }\n\t\t\tCOM_errorLog('DOCUMENTS DEBUG N07 category fetched cid=' . (isset($cat['cid']) ? (int) $cat['cid'] : 0));"
          # This exact sequence occurs several times; replace the occurrence inside the new case only.
          start = s.find("\tcase 'new' :")
          end = s.find("\tcase 'edit' :", start)
          block = s[start:end]
          if old not in block:
              raise SystemExit('query anchor not found in new route')
          block = block.replace(old, new, 1)
          s = s[:start] + block + s[end:]

          old = "\t\t$content = DOCUMENTS_editDoc($doc);\n\t\t\n\t\tbreak;"
          new = "\t\tif ($documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N08 before DOCUMENTS_editDoc()</pre>'; @ob_flush(); @flush(); }\n\t\tCOM_errorLog('DOCUMENTS DEBUG N08 before DOCUMENTS_editDoc()');\n\t\t$content = DOCUMENTS_editDoc($doc);\n\t\tif ($documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N09 after DOCUMENTS_editDoc() length=' . strlen((string) $content) . '</pre>'; @ob_flush(); @flush(); }\n\t\tCOM_errorLog('DOCUMENTS DEBUG N09 after DOCUMENTS_editDoc() length=' . strlen((string) $content));\n\t\t\n\t\tbreak;"
          start = s.find("\tcase 'new' :")
          end = s.find("\tcase 'edit' :", start)
          block = s[start:end]
          if old not in block:
              raise SystemExit('editDoc anchor not found')
          block = block.replace(old, new, 1)
          s = s[:start] + block + s[end:]

          old = "$display .= DOCUMENTS_user_menu();"
          new = "if (isset($documentsDebug) && $documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N10 before user menu</pre>'; @ob_flush(); @flush(); }\nCOM_errorLog('DOCUMENTS DEBUG N10 before user menu');\n$display .= DOCUMENTS_user_menu();\nif (isset($documentsDebug) && $documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N11 after user menu</pre>'; @ob_flush(); @flush(); }\nCOM_errorLog('DOCUMENTS DEBUG N11 after user menu');"
          if old not in s:
              raise SystemExit('user menu anchor not found')
          s = s.replace(old, new, 1)

          old = "$display = COM_createHTMLDocument(\n    $display,\n    array('pagetitle' => $page_title)\n);"
          new = "if (isset($documentsDebug) && $documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N12 before COM_createHTMLDocument</pre>'; @ob_flush(); @flush(); }\nCOM_errorLog('DOCUMENTS DEBUG N12 before COM_createHTMLDocument');\n$display = COM_createHTMLDocument(\n    $display,\n    array('pagetitle' => $page_title)\n);\nif (isset($documentsDebug) && $documentsDebug) { echo '<pre style=\"background:#fff;color:#000;padding:10px\">DOCUMENTS DEBUG N13 after COM_createHTMLDocument length=' . strlen((string) $display) . '</pre>'; @ob_flush(); @flush(); }\nCOM_errorLog('DOCUMENTS DEBUG N13 after COM_createHTMLDocument length=' . strlen((string) $display));"
          if old not in s:
              raise SystemExit('HTML document anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Lint
        run: php -l include_html.php

      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include_html.php
          git commit -m 'Documents 1.1.2: add temporary new-route diagnostics'
          git push origin HEAD:modernize-1.1.2
