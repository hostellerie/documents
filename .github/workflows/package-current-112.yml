name: Package Documents 1.1.2 installable

on:
  push:
    branches:
      - modernize-1.1.2
    paths:
      - '.github/workflows/package-current-112.yml'
      - '*.php'
      - '*.inc'
      - 'admin/**'
      - 'language/**'
      - 'public_html/**'
      - 'sql/**'
      - 'templates/**'
      - 'install_defaults.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: modernize-1.1.2

      - name: Setup PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none

      - name: Lint PHP 5.6
        shell: bash
        run: |
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './test-artifacts/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP 8.1
        shell: bash
        run: |
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './test-artifacts/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Verify 1.1.2 runtime fixes
        shell: bash
        run: |
          grep -q "function DOCUMENTS_writeHtaccess" rewrite.php
          grep -q "DOCUMENTS_writeHtaccess(false)" public_html/index.php
          grep -q "DOCUMENTS_writeHtaccess(true)" autoinstall.php
          grep -q "function DOCUMENTS_user_menu" include_html.php
          grep -q "function DOCUMENTS_uploadImage" include_html.php
          ! grep -q "DOCUMENTS DEBUG" public_html/index.php
          if find . -type f -name '.gitkeep' -not -path './.git/*' | grep -q .; then
            echo 'Unexpected .gitkeep file found in source tree.'
            find . -type f -name '.gitkeep' -not -path './.git/*'
            exit 1
          fi

      - name: Build installable ZIP
        shell: bash
        run: |
          rm -rf build test-artifacts
          mkdir -p build/documents test-artifacts
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='test-artifacts' \
            --exclude='.gitkeep' \
            ./ build/documents/
          cd build
          zip -r ../test-artifacts/documents-1.1.2.zip documents >/dev/null
          cd ..
          if unzip -Z1 test-artifacts/documents-1.1.2.zip | grep -q '/\.gitkeep$'; then
            echo 'Archive contains .gitkeep.'
            exit 1
          fi
          printf 'Documents 1.1.2 installable package\nSource commit: %s\nPHP lint: 5.6 and 8.1\nPretty URLs: managed .htaccess generation enabled\n.gitkeep files: none\nRESULT: PASS\n' "$GITHUB_SHA" > test-artifacts/lint-report.txt

      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: documents-1.1.2-installable
          path: |
            test-artifacts/documents-1.1.2.zip
            test-artifacts/lint-report.txt
          if-no-files-found: error

      - name: Commit current package to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test-artifacts/documents-1.1.2.zip test-artifacts/lint-report.txt
          if git diff --cached --quiet; then
            echo 'Package already current.'
          else
            git commit -m 'Documents 1.1.2: refresh installable archive'
            git push origin HEAD:modernize-1.1.2
          fi
