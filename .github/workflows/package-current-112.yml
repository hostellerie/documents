name: Package Documents 1.1.2 installable

on:
  push:
    branches:
      - modernize-1.1.2
    paths:
      - '.github/workflows/package-current-112.yml'
      - '*.php'
      - '*.inc'
      - 'admin/**'
      - 'language/**'
      - 'public_html/**'
      - 'sql/**'
      - 'templates/**'
      - 'install_defaults.php'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: modernize-1.1.2

      - name: Normalize canonical redirects and remove diagnostics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Keep .htaccess for internal rewriting only.
          p = Path('rewrite.php')
          s = p.read_text()
          start = s.index('        $rules = "RewriteEngine On\\n\\n"')
          end = s.index('        if (@file_put_contents', start)
          rules = '''        $rules = "RewriteEngine On\\n\\n"
              . "RewriteCond %{REQUEST_FILENAME} !-f\\n"
              . "RewriteCond %{REQUEST_FILENAME} !-d\\n"
              . "RewriteRule ^([^/]+)/([^/]+)/?$ index.php?mode=view&cat=$1&doc=$2 [L,QSA]\\n\\n"
              . "RewriteCond %{REQUEST_FILENAME} !-f\\n"
              . "RewriteCond %{REQUEST_FILENAME} !-d\\n"
              . "RewriteRule ^([^/]+)/?$ index.php?mode=view&cat=$1 [L,QSA]\\n";

'''
          s = s[:start] + rules + s[end:]
          p.write_text(s)

          # Canonicalize explicit index.php view URLs in PHP, where an absolute
          # site URL can be emitted without Apache filesystem path expansion.
          p = Path('public_html/index.php')
          s = p.read_text()
          marker = "DOCUMENTS_initializeRequestDefaults($_REQUEST);\n\n"
          block = r'''DOCUMENTS_initializeRequestDefaults($_REQUEST);

$requestPath = isset($_SERVER['REQUEST_URI'])
    ? parse_url((string) $_SERVER['REQUEST_URI'], PHP_URL_PATH)
    : '';
if (is_string($requestPath) && preg_match('#/index\.php$#', $requestPath)) {
    $mode = (string) DOCUMENTS_requestValue($_REQUEST, 'mode', '');
    $catUrl = (string) DOCUMENTS_requestValue($_REQUEST, 'cat', '');
    $docUrl = (string) DOCUMENTS_requestValue($_REQUEST, 'doc', '');

    if ($mode === 'view' && $catUrl !== '') {
        $canonical = rtrim((string) $_DOCUMENTS_CONF['site_url'], '/')
            . '/' . rawurlencode($catUrl);
        if ($docUrl !== '') {
            $canonical .= '/' . rawurlencode($docUrl);
        }
        header('Location: ' . $canonical, true, 301);
        exit;
    }
}

'''
          if "header('Location: ' . $canonical, true, 301);" not in s:
              if marker not in s:
                  raise SystemExit('public index canonicalization anchor missing')
              s = s.replace(marker, block, 1)
          p.write_text(s)

          # Remove all temporary N01-N15 diagnostics from include_html.php.
          p = Path('include_html.php')
          s = p.read_text()
          s = re.sub(r"^.*DOCUMENTS DEBUG N(?:0[1-9]|1[0-5]).*\n", "", s, flags=re.M)
          s = re.sub(r"^\s*\$documentsDebug = isset\(\$_GET\['documents_debug'\]\).*\n", "", s, flags=re.M)
          s = re.sub(
              r"\nif \(isset\(\$documentsDebug\) && \$documentsDebug\) \{\n"
              r"\s*echo '<div style=\\?\"position:fixed;.*?DOCUMENTS OUTPUT SENTINEL.*?\n"
              r"\s*@ob_flush\(\);\n\s*@flush\(\);\n\}\n",
              "\n",
              s,
              flags=re.S
          )
          # Defensive cleanup for any remaining debug-only browser echo lines.
          s = re.sub(r"^.*documents_debug.*\n", "", s, flags=re.M)
          s = re.sub(r"^.*DOCUMENTS OUTPUT SENTINEL.*\n", "", s, flags=re.M)
          s = re.sub(r"^\s*@ob_flush\(\);\n\s*@flush\(\);\n\}\n", "", s, flags=re.M)
          if 'DOCUMENTS DEBUG N' in s or 'documents_debug' in s or 'DOCUMENTS OUTPUT SENTINEL' in s:
              raise SystemExit('temporary Documents diagnostics remain')
          p.write_text(s)
          PY

      - name: Setup PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none

      - name: Lint PHP 5.6
        shell: bash
        run: |
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './test-artifacts/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP 8.1
        shell: bash
        run: |
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './test-artifacts/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Verify 1.1.2 runtime fixes
        shell: bash
        run: |
          grep -q "function DOCUMENTS_writeHtaccess" rewrite.php
          grep -q "DOCUMENTS_writeHtaccess(false)" public_html/index.php
          grep -q "DOCUMENTS_writeHtaccess(true)" autoinstall.php
          grep -q "header('Location: ' . \$canonical, true, 301)" public_html/index.php
          ! grep -q "THE_REQUEST" rewrite.php
          ! grep -q "DOCUMENTS DEBUG N" include_html.php
          ! grep -q "documents_debug" include_html.php
          if find . -type f -name '.gitkeep' -not -path './.git/*' | grep -q .; then
            echo 'Unexpected .gitkeep file found in source tree.'
            find . -type f -name '.gitkeep' -not -path './.git/*'
            exit 1
          fi

      - name: Build installable ZIP
        shell: bash
        run: |
          rm -rf build test-artifacts
          mkdir -p build/documents test-artifacts
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='test-artifacts' \
            --exclude='.gitkeep' \
            ./ build/documents/
          cd build
          zip -r ../test-artifacts/documents-1.1.2.zip documents >/dev/null
          cd ..
          if unzip -Z1 test-artifacts/documents-1.1.2.zip | grep -q '/\.gitkeep$'; then
            echo 'Archive contains .gitkeep.'
            exit 1
          fi
          printf 'Documents 1.1.2 installable package\nSource commit: %s\nPHP lint: 5.6 and 8.1\nCanonical redirects: PHP 301\nPretty URLs: .htaccess internal rewriting only\nTemporary debug logs: removed\n.gitkeep files: none\nRESULT: PASS\n' "$GITHUB_SHA" > test-artifacts/lint-report.txt

      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: documents-1.1.2-installable
          path: |
            test-artifacts/documents-1.1.2.zip
            test-artifacts/lint-report.txt
          if-no-files-found: error

      - name: Commit normalized source and current package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rewrite.php public_html/index.php include_html.php test-artifacts/documents-1.1.2.zip test-artifacts/lint-report.txt
          if git diff --cached --quiet; then
            echo 'Source and package already current.'
          else
            git commit -m 'Documents 1.1.2: fix canonical redirects, clean debug and rebuild package'
            git push origin HEAD:modernize-1.1.2
          fi
