name: Package Documents installable

on:
  push:
    branches:
      - modernize-1.1.9
    paths:
      - '.github/workflows/package-current.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none

      - name: Lint PHP 5.6
        shell: bash
        run: |
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './test-artifacts/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Run tests PHP 5.6
        shell: bash
        run: |
          php tests/storage_migration_test.php
          php tests/config_upgrade_test.php
          php tests/language_sync_test.php
          php tests/document_visibility_test.php
          php tests/document_edit_security_test.php
          php tests/comment_security_test.php
          php tests/release_candidate_test.php
          php tests/metadata_consistency_test.php

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP 8.1
        shell: bash
        run: |
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './test-artifacts/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Run tests PHP 8.1
        shell: bash
        run: |
          php tests/storage_migration_test.php
          php tests/config_upgrade_test.php
          php tests/language_sync_test.php
          php tests/document_visibility_test.php
          php tests/document_edit_security_test.php
          php tests/comment_security_test.php
          php tests/release_candidate_test.php
          php tests/metadata_consistency_test.php

      - name: Build installable ZIP
        shell: bash
        run: |
          rm -rf build test-artifacts
          mkdir -p build/documents test-artifacts
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='test-artifacts' \
            --exclude='tests' \
            --exclude='.gitkeep' \
            ./ build/documents/
          cd build
          zip -r ../test-artifacts/documents-1.1.9.zip documents >/dev/null

      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: documents-1.1.9-installable
          path: test-artifacts/documents-1.1.9.zip
          if-no-files-found: error

      - name: Store current test archive in branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f test-artifacts/documents-1.1.9.zip
          if git diff --cached --quiet; then
            echo 'Archive already current.'
          else
            git commit -m 'Documents 1.1.9: refresh test archive'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
