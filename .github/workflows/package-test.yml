name: Package Documents test build

on:
  push:
    branches:
      - modernize-1.1.1
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable archive
        run: |
          mkdir -p build/documents
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' ./ build/documents/
          cd build
          zip -r documents-1.1.2-test.zip documents

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: documents-1.1.2-test
          path: build/documents-1.1.2-test.zip
          if-no-files-found: error
