name: Build Documents archive

on:
  push:
    branches:
      - modernize-1.1.10
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documents-archive
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.1.10

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none

      - name: PHP 5.6 syntax
        run: find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

      - name: PHP 5.6 regression tests
        run: |
          set -e
          for test in tests/*_test.php; do
            echo "Running ${test}"
            php "${test}"
          done

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: PHP 8.1 syntax
        run: find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

      - name: PHP 8.1 regression tests
        run: |
          set -e
          for test in tests/*_test.php; do
            echo "Running ${test}"
            php "${test}"
          done

      - name: Build ZIP
        run: |
          rm -rf build
          mkdir -p build/documents dist
          rsync -a ./ build/documents/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'tests/' \
            --exclude 'docs/' \
            --exclude 'ROADMAP.md' \
            --exclude 'TESTING.md'
          cd build
          zip -qr ../dist/documents_1.2.0-2.1.1.zip documents
          cd ..
          unzip -t dist/documents_1.2.0-2.1.1.zip >/dev/null

      - name: Commit ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/documents_1.2.0-2.1.1.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Build Documents 1.2.0 archive [skip ci]'
          git push origin HEAD:modernize-1.1.10
