name: Build Documents archive

on:
  push:
    branches:
      - modernize-1.1.10
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documents-archive
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/documents dist

          rsync -a ./ build/documents/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.htaccess' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'tests/' \
            --exclude 'docs/' \
            --exclude 'ROADMAP.md' \
            --exclude 'TESTING.md'

          rm -f dist/documents_1.2.0-2.1.1.zip
          (cd build && zip -qr ../dist/documents_1.2.0-2.1.1.zip documents)
          unzip -t dist/documents_1.2.0-2.1.1.zip >/dev/null

          if unzip -Z1 dist/documents_1.2.0-2.1.1.zip | grep -E '(^|/)\.htaccess$'; then
            echo 'Error: .htaccess must not be shipped in a Geeklog installable archive.' >&2
            exit 1
          fi

      - name: Publish workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: documents-1.2.0-installable
          path: dist/documents_1.2.0-2.1.1.zip
          if-no-files-found: error
          retention-days: 30

      - name: Update dist archive
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/documents_1.2.0-2.1.1.zip

          if git diff --cached --quiet; then
            echo 'Archive is already up to date.'
            exit 0
          fi

          git commit -m 'Build Documents 1.2.0 archive [skip ci]'
          git push origin HEAD:modernize-1.1.10 || echo 'Warning: artifact was created, but dist/ could not be pushed.'
