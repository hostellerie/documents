name: Test and build Documents

on:
  push:
    branches:
      - modernize-1.1.10
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documents-build-modernize-1.1.10
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: modernize-1.1.10

      - name: PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none

      - name: Test PHP 5.6
        shell: bash
        run: |
          set -e
          find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
          for test in tests/*_test.php; do php "$test"; done

      - name: PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Test PHP 8.1
        shell: bash
        run: |
          set -e
          find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
          for test in tests/*_test.php; do php "$test"; done

      - name: Build archive
        shell: bash
        run: |
          set -e
          rm -rf build
          mkdir -p build/documents dist

          rsync -a ./ build/documents/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'tests/' \
            --exclude 'docs/' \
            --exclude 'ROADMAP.md' \
            --exclude 'TESTING.md'

          cd build
          zip -qr ../dist/documents_1.2.0-2.1.1.zip documents
          cd ..
          unzip -t dist/documents_1.2.0-2.1.1.zip >/dev/null

      - name: Save archive in dist
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/documents_1.2.0-2.1.1.zip

          if git diff --cached --quiet; then
            echo 'Archive unchanged.'
            exit 0
          fi

          git commit -m 'Build Documents 1.2.0 archive [skip ci]'
          git push origin HEAD:modernize-1.1.10
