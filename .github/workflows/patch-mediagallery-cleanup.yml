name: Patch MediaGallery cleanup

on:
  push:
    branches: [modernize-1.1.10]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.1.10
          fetch-depth: 0
      - name: Remove legacy MediaGallery SQL renderer
        env:
          NEW_CASE_B64: 
        run: |
          python3 -c "import os,base64; from pathlib import Path; p=Path('include_html.php'); t=p.read_text(); s=t.index(\"        case 'album':\\n\"); e=t.index(\"        case 'category':\", s); n=base64.b64decode(os.environ['NEW_CASE_B64']).decode(); t=t[:s]+n+t[e:]; fs=t.index('function DOCUMENTS_albumGallery('); fe=t.index('function DOCUMENTS_hit ', fs); t=t[:fs]+t[fe:]; p.write_text(t)"
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include_html.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove direct MediaGallery storage access from Documents"
          git push origin HEAD:modernize-1.1.10
