name: Replace Documents user menu template

on:
  push:
    branches:
      - modernize-1.1.2
    paths:
      - '.github/workflows/replace-user-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.1.2

      - name: Replace user menu renderer
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('include_html.php')
          s = p.read_text()
          start = s.index('function DOCUMENTS_user_menu()')
          end = s.index('\nfunction DOCUMENTS_missingFieldCat', start)
          new = '''function DOCUMENTS_user_menu()\n{\n    global $_DOCUMENTS_CONF, $LANG_DOCUMENTS_1;\n\n    $siteUrl = rtrim((string) $_DOCUMENTS_CONF['site_url'], '/');\n    $documentsLabel = isset($LANG_DOCUMENTS_1['documents']) ? $LANG_DOCUMENTS_1['documents'] : 'Documents';\n    $fieldsLabel = isset($LANG_DOCUMENTS_1['fields']) ? $LANG_DOCUMENTS_1['fields'] : 'Fields';\n    $selectsLabel = isset($LANG_DOCUMENTS_1['selects']) ? $LANG_DOCUMENTS_1['selects'] : 'Selects';\n\n    $html = '<div class="user_menu"><p><a href="'\n        . htmlspecialchars($siteUrl . '/', ENT_QUOTES, 'UTF-8') . '">'\n        . htmlspecialchars($documentsLabel, ENT_QUOTES, 'UTF-8') . '</a>';\n\n    if (defined('CAT_NAME') && defined('CAT_URL')) {\n        $html .= ' > <a href="'\n            . htmlspecialchars($siteUrl . '/' . CAT_URL, ENT_QUOTES, 'UTF-8') . '">'\n            . htmlspecialchars(CAT_NAME, ENT_QUOTES, 'UTF-8') . '</a>';\n    }\n\n    if (defined('DOC_NAME') && defined('DOC_URL') && defined('CAT_URL')) {\n        $html .= ' > <a href="'\n            . htmlspecialchars($siteUrl . '/' . CAT_URL . '/' . DOC_URL, ENT_QUOTES, 'UTF-8') . '">'\n            . htmlspecialchars(DOC_NAME, ENT_QUOTES, 'UTF-8') . '</a>';\n    } elseif (SEC_hasRights('documents.admin')) {\n        $html .= ' > <a href="'\n            . htmlspecialchars($siteUrl . '/index.php?mode=list_fields', ENT_QUOTES, 'UTF-8') . '">'\n            . htmlspecialchars($fieldsLabel, ENT_QUOTES, 'UTF-8') . '</a>';\n\n        $mode = DOCUMENTS_requestValue($_REQUEST, 'mode');\n        if ($mode === 'list_fields' || $mode === 'list_groups') {\n            $html .= ' > <a href="'\n                . htmlspecialchars($siteUrl . '/index.php?mode=list_groups', ENT_QUOTES, 'UTF-8') . '">'\n                . htmlspecialchars($selectsLabel, ENT_QUOTES, 'UTF-8') . '</a>';\n        }\n    }\n\n    $html .= '</p></div>';\n\n    return $html;\n}\n'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY

      - name: Lint
        run: php -l include_html.php

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include_html.php
          git commit -m 'Documents 1.1.2: render user menu without legacy template'
          git push origin HEAD:modernize-1.1.2
